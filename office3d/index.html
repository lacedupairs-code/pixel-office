<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<base href="/office/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-switch.css">
<style>
:root{--bg:#0b0a12;--panel:#14111d;--panel2:#1c1828;--line:#2a2440;--text:#f1edf9;--mute:#a49cb8;--dim:#6e6683;--hq:#ff8a3d;--jarvis:#38e1ff;--bot:#ff6fb1;--agents:#a78bfa;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:2px solid #000;background:linear-gradient(#1a1525,#110e19);flex-wrap:wrap}
.logo{font-family:"Press Start 2P",monospace;font-size:20px;white-space:nowrap}
.logo .a{background:linear-gradient(#ffe36b,#ff8a3d 60%,#ff4f6d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 #000)}
.logo .b{color:#fff;filter:drop-shadow(2px 2px 0 #3a6bff)}
.sub{font-family:Silkscreen,monospace;font-size:11px;color:#9df27a;margin-top:4px}
.stats{display:flex;gap:6px}
.stat{font-family:Silkscreen,monospace;font-size:11px;padding:5px 9px;border-radius:6px;background:#000;color:var(--mute)}
.stat b{font-size:13px;margin-left:4px}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{font-family:Silkscreen,monospace;font-size:11px;padding:5px 10px;border:2px solid #000;border-radius:6px;background:var(--panel2);color:var(--mute);cursor:pointer;box-shadow:0 2px 0 #000;user-select:none}
.chip:focus-visible,.tool:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.chip{min-height:36px}
.chip.on{color:#111;background:#ffe36b}
.chip .d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
main{display:grid;grid-template-columns:1fr 330px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#05050a}
#view{position:absolute;inset:0}
#view canvas{display:block;cursor:grab}
#view canvas:active{cursor:grabbing}
#view canvas:focus-visible{outline:2px solid #ffe36b;outline-offset:-3px}
.labels{position:absolute;inset:0;pointer-events:none}
.classic{position:absolute;left:12px;top:44px;z-index:3;text-decoration:none}
.mock{position:absolute;left:12px;top:12px;font-family:Silkscreen,monospace;font-size:10px;color:#000;background:#ffe36b;padding:3px 8px;border-radius:4px;box-shadow:2px 2px 0 #000;z-index:3}
.tools{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:3}
.tool{font-family:Silkscreen,monospace;font-size:11px;background:rgba(10,8,16,.85);color:var(--text);border:2px solid #000;border-radius:6px;padding:5px 9px;cursor:pointer;box-shadow:0 2px 0 #000;user-select:none}
.tool:hover{background:#2a2340}
.tool:focus-visible{outline:2px solid #ffe36b;outline-offset:2px}
.navigation{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(10,8,16,.9)}
.nav-buttons{display:flex;gap:6px;align-items:center}
.navigation .tool{min-width:44px;min-height:44px;font:600 18px Inter,system-ui,sans-serif;padding:6px}
.navigation .nav-mode{font:11px Silkscreen;min-width:72px}
.navigation .nav-mode[aria-pressed="true"]{background:#ffe36b;color:#111}
.nav-hint{font:11px Inter,system-ui,sans-serif;color:var(--mute);max-width:310px}
@media(max-width:520px){.tools{gap:3px;right:6px}.tools .tool{font-size:9px;padding:6px}.navigation{left:8px;bottom:8px;padding:8px}.nav-hint{max-width:280px}}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#2a1d08;border:2px solid var(--warn);color:#ffe9b0;font-family:Silkscreen,monospace;font-size:11px;padding:7px 12px;border-radius:8px;box-shadow:0 3px 0 #000;display:none;white-space:nowrap;z-index:4}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:Silkscreen,monospace;color:var(--mute);z-index:5;background:#05050a}
aside{border-left:2px solid #000;background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-height:0}
.inspector{padding:14px;border-bottom:2px solid #000;min-height:200px}
h3{margin:0;font-family:Silkscreen,monospace;font-size:12px;color:var(--mute);font-weight:400}
.who{display:flex;gap:12px;align-items:center;margin-top:10px}
.who>div:last-child{min-width:0;overflow-wrap:anywhere}
.kv>span,.ev>span{min-width:0;overflow-wrap:anywhere}
.av{width:52px;height:52px;border-radius:12px;border:2px solid #000;display:grid;place-items:center;font-size:24px}
.who .n{font-weight:700;font-size:16px}.who .r{color:var(--mute);font-size:12.5px}
.tag{display:inline-block;font-family:Silkscreen,monospace;font-size:10px;padding:1px 6px;border-radius:4px;color:#000;margin-top:4px}
.kv{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;margin-top:12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--dim)}
.btn{text-decoration:none;display:inline-block;margin-top:12px;font-family:Silkscreen,monospace;font-size:11px;background:#ff8a3d;color:#1a0d00;border:2px solid #000;border-radius:6px;padding:6px 10px;box-shadow:0 2px 0 #000}
.empty{color:var(--dim);font-size:12.5px;margin-top:10px}
.feed{overflow:auto;padding:12px 14px;min-height:0}
.ev{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.ev time{font-family:Silkscreen,monospace;font-size:10px;color:var(--dim);padding-top:2px}
/* labels over the 3D scene */
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;will-change:transform}
.lbl.dim{opacity:.15}
.name{font:600 11px Inter;background:rgba(10,8,16,.82);color:#f1edf9;padding:2px 8px 2px 6px;border-radius:9px;display:flex;align-items:center;gap:5px}
.name i{width:7px;height:7px;border-radius:50%;display:inline-block}
.bub{font:11px Silkscreen;background:#fff;color:#111;border:2px solid #111;border-radius:6px;padding:3px 8px;position:relative;animation:pop .25s ease-out}
.bub:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#111;border-bottom:0}
.ban{font:9px "Press Start 2P";background:#ffe36b;color:#111;border:2px solid #000;border-radius:3px;padding:4px 6px;animation:pop .3s ease-out}
.sign{font:9px Silkscreen;color:#f5e7c4;background:#1b1424;border-top:2px solid #d4af37;padding:2px 6px;border-radius:2px;letter-spacing:.5px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:1fr 200px}aside{border-left:0;border-top:2px solid #000;grid-template-columns:1fr 1fr;grid-template-rows:1fr}.inspector{border-bottom:0;border-right:2px solid #000;min-height:0;overflow:auto}.logo{font-size:14px}.chips{margin-left:0}}
@media (max-width:520px){aside{grid-template-columns:1fr}.feed,.stats,.mock{display:none}.chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%}.toast{white-space:normal;width:90%;text-align:center;font-size:10px}}
/* Detailed office presentation: neutral chrome leaves the warm scene in focus. */
:root{--bg:#101119;--panel:#171722;--panel2:#222230;--line:#30303d;--mute:#a5a6ba;--dim:#85869a}
header{background:linear-gradient(#20212a,#12131c);padding:12px 16px}
main{grid-template-columns:minmax(0,1fr) 310px}
.stage{background:#887661}
.inspector{min-height:190px;padding:18px}
.empty{color:var(--mute);line-height:1.7}
.av{overflow:hidden;width:64px;height:64px;background:#252733!important}
.av img{width:100%;height:100%;object-fit:cover}
.room-sign{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:10px Silkscreen,monospace;letter-spacing:.5px;color:#fff;background:#25252beF;border:1px solid #a9a08d;box-shadow:0 3px 5px #0007;border-radius:3px;padding:5px 12px;will-change:transform}
.sign{border-color:#c9c1ac}
.feed{padding:18px}
.ev{padding:10px 0;line-height:1.6}
.name{background:#202128e8;box-shadow:0 2px 5px #0004}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 210px}.room-sign{font-size:8px;padding:3px 5px}}
@media(max-width:520px){header{padding:10px;gap:9px}.room-sign{font-size:7px;padding:2px 4px}.av{width:52px;height:52px}.inspector{padding:12px}}
</style>
<style>
/* Day/night controls share the scene's setting; the inspector remains readable in either. */
:root[data-appearance=light]{--bg:#f4f2ef;--panel:#fffdf9;--panel2:#eae6df;--line:#c7c0b5;--text:#282a30;--mute:#555b65;--dim:#626976;--ok:#237446;--warn:#8c5906}
:root[data-appearance=light] header{background:var(--panel);border-color:var(--line)}
:root[data-appearance=light] .logo .b{color:var(--text);filter:none}
:root[data-appearance=light] .sub{color:#326637}
:root[data-appearance=light] :is(.stat,.tool,.navigation){background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:none}
:root[data-appearance=light] :is(aside,.inspector){border-color:var(--line)}
.tools{align-items:center}.tools .theme-switch{color:var(--text)}
@media(max-width:520px){.tools .tool{min-height:44px;font-size:11px}.tools{align-items:center;flex-wrap:wrap;max-width:calc(100% - 60px)}}
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
<header>
  <div><div class="logo"><span class="a">AGENT</span> <span class="b">OFFICE</span></div><div class="sub">EVERY AGENT IN HQ · JARVIS · LACEDUPBOT, LIVE</div></div>
  <div class="stats"><span class="stat">WORKING<b id="sWork" style="color:var(--ok)">0</b></span><span class="stat">NEEDS YOU<b id="sWait" style="color:var(--warn)">0</b></span><span class="stat">IN OFFICE<b id="sAll">0</b></span></div>
  <div class="chips" id="filters" role="group" aria-label="Show agents by organization">
    <button type="button" class="chip on" data-f="all" aria-pressed="true">ALL</button>
    <button type="button" class="chip" data-f="HQ" aria-pressed="false"><span class="d" style="background:var(--hq)"></span>HQ</button>
    <button type="button" class="chip" data-f="Jarvis" aria-pressed="false"><span class="d" style="background:var(--jarvis)"></span>JARVIS</button>
    <button type="button" class="chip" data-f="Agents" aria-pressed="false"><span class="d" style="background:var(--agents)"></span>AGENTS</button>
    <button type="button" class="chip" data-f="LacedupBot" aria-pressed="false"><span class="d" style="background:var(--bot)"></span>LACEDUPBOT</button>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <div id="view"></div>
    <div class="labels" id="labels"></div>
    <div class="mock" id="mode" role="status" aria-live="polite">CONNECTING…</div><a class="tool classic" href="/classic/" title="The classic 2D Pixel Office">2D</a>
    <div class="tools"><button type="button" class="theme-switch" id="night" role="switch" aria-label="Night mode" aria-checked="false"><svg class="theme-scene" viewBox="0 0 96 44" aria-hidden="true" focusable="false">
  <rect class="theme-sky" x="1" y="1" width="94" height="42" rx="21" />
  <g class="theme-clouds"><path d="M48 43a9 9 0 0 1 17-4 12 12 0 0 1 23-5 8 8 0 0 1 8 8v2H48Z"/><circle cx="86" cy="17" r="12"/></g>
  <g class="theme-stars"><path d="m17 12 1 3 3 1-3 1-1 3-1-3-3-1 3-1Zm22 12 1 2 2 1-2 1-1 2-1-2-2-1 2-1Z"/><circle cx="10" cy="28" r="1"/><circle cx="29" cy="9" r="1"/><circle cx="47" cy="16" r="1.2"/></g>
  <g class="theme-thumb"><circle class="theme-ring" r="36"/><circle class="theme-ring" r="29"/><circle class="theme-ring" r="23"/><circle class="theme-disc" r="17"/><g class="theme-craters"><circle cx="-6" cy="2" r="5"/><circle cx="5" cy="-7" r="3"/><circle cx="7" cy="6" r="3.5"/></g></g>
  <rect class="theme-rim" x="1" y="1" width="94" height="42" rx="21" />
</svg></button><button type="button" class="tool" id="quality" aria-label="High graphics quality" aria-pressed="true">HIGH</button><button class="tool" id="desks" title="See the detailed workstations">DESKS</button><button class="tool" id="fit" title="Reset the camera to the office overview (Home)">⤢ OVERVIEW</button></div>
    <div class="navigation" role="group" aria-label="Camera navigation">
      <div class="nav-buttons">
        <button class="tool" id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button>
        <button class="tool" id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <button class="tool nav-mode" id="rotate" aria-pressed="false" title="Drag rotates the view; turn off to drag-move instead">ROTATE</button>
      </div>
      <div class="nav-buttons">
        <button class="tool" data-pan="left" aria-label="Move view left" title="Move left (A or left arrow)">←</button>
        <button class="tool" data-pan="up" aria-label="Move view forward" title="Move forward (W or up arrow)">↑</button>
        <button class="tool" data-pan="down" aria-label="Move view backward" title="Move backward (S or down arrow)">↓</button>
        <button class="tool" data-pan="right" aria-label="Move view right" title="Move right (D or right arrow)">→</button>
      </div>
      <div class="nav-hint" id="navHint">Drag to rotate · Right-drag to move · Scroll to zoom · WASD / arrows</div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="loading" id="loading">LOADING THE OFFICE…</div>
  </div>
  <aside>
    <div class="inspector" id="insp"></div>
    <div class="feed"><h3>ACTIVITY</h3><div id="feed"></div></div>
  </aside>
</main>
</div>
<script type="module">
import { escapeHTML as esc, safeLink, appHealth, createLivePoller } from "./live-ui.mjs";
import * as THREE from "three";
import { DETAIL_PROPS, furnishInterior, dressHuman, typeAtDesk, disposeHuman } from "./interior.js";
import { refineInterior, workstationTexture, styleHair, SecurityViews, smoothCharacterGeometry } from "./premium.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { retargetClips, UAL_TO_SYNTY } from "./retarget.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// =============================================================================================
// Settings
// =============================================================================================
const q = new URLSearchParams(location.search);
const MOBILE = matchMedia("(pointer: coarse)").matches || innerWidth < 800;
let HIGH = q.get("q") ? q.get("q") === "high" : !MOBILE;
const ORG = { HQ: "#ff8a3d", Jarvis: "#38e1ff", Agents: "#a78bfa", LacedupBot: "#ff6fb1" };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (l) => l[Math.floor(Math.random() * l.length)];

// =============================================================================================
// The floor plan: cells of 1 unit. Walls sit on the edges between different zones.
// =============================================================================================
const W = 32, D = 19;
const ROOMS = [
  { id: "server", name: "SERVER ROOM", x: 0, z: 0, w: 6, d: 6, floor: "server", wall: "#c8c4b8" },
  { id: "library", name: "LIBRARY", x: 6, z: 0, w: 6, d: 6, floor: "library", wall: "#e8dcc6" },
  { id: "war", name: "WAR ROOM", x: 12, z: 0, w: 9, d: 6, floor: "carpet", wall: "#e2d6be" },
  { id: "proof", name: "PROOF STUDIO", x: 21, z: 0, w: 5, d: 6, floor: "studio", wall: "#f3e8ef" },
  { id: "ship", name: "SHIP DOCK", x: 26, z: 0, w: 6, d: 6, floor: "dock", wall: "#6b7280" },
  { id: "build", name: "BUILD FLOOR", x: 0, z: 7, w: 13, d: 6, floor: "office", wall: "#e0d2ba" },
  { id: "lobby", name: "LOBBY", x: 13, z: 7, w: 6, d: 6, floor: "marble", wall: "#f5efe4" },
  { id: "break", name: "BREAK ROOM", x: 19, z: 7, w: 13, d: 6, floor: "checker", wall: "#f2e6cf" },
  { id: "bots", name: "LACEDUPBOT", x: 0, z: 14, w: 9, d: 5, floor: "tech", wall: "#c9b9a2" },
  { id: "lounge", name: "AGENT LOUNGE", x: 9, z: 14, w: 10, d: 5, floor: "purple", wall: "#d9c8b4" },
  { id: "vault", name: "VAULT", x: 19, z: 14, w: 6, d: 5, floor: "metal", wall: "#6b7280" },
  { id: "security", name: "SECURITY", x: 25, z: 14, w: 7, d: 5, floor: "sec", wall: "#c7c6bd" },
];
const zone = Array.from({ length: D }, () => Array(W).fill("hall"));
for (const r of ROOMS) for (let z = r.z; z < r.z + r.d; z++) for (let x = r.x; x < r.x + r.w; x++) zone[z][x] = r.id;
// doors: [x, z] of a room cell whose edge to the hall (above or below) is open
const DOORS = [[2, 5], [9, 5], [16, 5], [17, 5], [23, 5], [28, 5], [3, 7], [9, 7], [15, 7], [16, 7], [24, 7],
  [6, 12], [15, 12], [16, 12], [26, 12], [4, 14], [13, 14], [14, 14], [21, 14], [28, 14]];
const doorSet = new Set(DOORS.map(([x, z]) => `${x},${z}`));
const ENTRANCE = { x: 31, z: 13 }, OUTSIDE = { x: 33, z: 13 };
const blocked = Array.from({ length: D }, () => Array(W).fill(false));
// a wall between (x,z) and its neighbour?
function wallBetween(x, z, nx, nz) {
  if (nx < 0 || nz < 0 || nx >= W || nz >= D) return !(x === ENTRANCE.x && z === ENTRANCE.z && nx === W);
  const a = zone[z][x], b = zone[nz][nx];
  if (a === b) return false;
  if (a === "hall" || b === "hall") { const r = a === "hall" ? [nx, nz] : [x, z]; return !doorSet.has(`${r[0]},${r[1]}`); }
  return true;
}

// =============================================================================================
// Renderer, scene, camera, post-processing
// =============================================================================================
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, HIGH ? 2 : 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.96;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.15;
controls.minDistance = 3; controls.maxDistance = 80;
controls.cursorStyle = "grab";
controls.panSpeed = 1.3;
controls.zoomSpeed = 1.2;
controls.zoomToCursor = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
renderer.domElement.tabIndex = 0;
renderer.domElement.setAttribute("aria-label", "Office view. Drag to move, scroll or pinch to zoom. Use arrow keys or WASD to move, plus and minus to zoom, Home for overview.");
controls.screenSpacePanning = false;
const HOME = { target: new THREE.Vector3(W / 2, .25, D / 2), pos: new THREE.Vector3(W / 2, 30, D / 2 + 23) };
function fitOffice() {
  const aspect = Math.max(.35, view.clientWidth / Math.max(1, view.clientHeight));
  const distance = Math.max((W + 3) / aspect, D * .82 + 5) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) + 5;
  HOME.pos.copy(HOME.target).add(new THREE.Vector3(0, .8, .6).multiplyScalar(distance));
}
function overview() { fitOffice(); cam.follow = null; cam.goal = { target: HOME.target.clone(), pos: HOME.pos.clone() }; }
const cam = { follow: null, goal: null };
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: 0.42, distanceExponent: 1.8, thickness: 0.7, scale: 1.15 });
gtao.blendIntensity = 1.1;
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.5, 0.82);
composer.addPass(bloom);
const smaa = new SMAAPass(); composer.addPass(smaa);
composer.addPass(new OutputPass());
let securityViews = null;

// =============================================================================================
// Baked lighting (2026-10-05): the building and its furniture lit by Blender (office3d/bake/). The
// light is baked into a lightmap (one for day, one for night) that the furniture's own textures are
// multiplied by; agents and everything that moves or glows stay live. Without the baked files (they're
// made from the Synty models, so they live on the host only, in private-assets/synty/baked/), the
// office uses its live lights as before. ?baked=0 shows the live lights anyway.
// =============================================================================================
const BAKED = { on: false, meta: null, mats: [], props: [], maps: {}, statics: [] };
// what the bake covers: meshes that never move, change or glow (screens, LEDs, signs, glass and the
// rocket stay live, as does the ground outside), and whose look is just colour and texture: the
// tailored furniture's leather, fabric and wood grain (bump maps, sheen) stays live too
// (kept, if given, collects the still, solid meshes that stay live: they go to Blender only to cast shadows)
function staticMeshes(kept) {
  const skip = new Set();
  for (const root of [rocket.group, vault.wheel]) root && root.traverse((o) => skip.add(o));
  const live = (m) => m.transparent || m.isMeshBasicMaterial || m.isMeshPhysicalMaterial || !!m.bumpMap || !!m.normalMap || !!m.emissiveMap || (m.emissive && m.emissiveIntensity > 0 && m.emissive.getHex() !== 0);
  const out = [];
  world.traverse((o) => {
    if (!o.isMesh || o.isSkinnedMesh || skip.has(o) || o.userData.outside || o.userData.catcher) return;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    if (ms.some(live)) { if (kept && !ms.some((m) => m.transparent || m.isMeshBasicMaterial)) kept.push(o); return; }
    out.push(o);
  });
  return out;
}
// The scene Blender bakes, and the lights it needs (run locally: office3d/bake/README.md)
async function bakeExport() {
  const { GLTFExporter } = await import("three/addons/exporters/GLTFExporter.js");
  const out = new THREE.Scene();
  world.updateMatrixWorld(true);
  const kept = [];
  for (const o of staticMeshes(kept)) { const c = new THREE.Mesh(o.geometry, o.material); c.applyMatrix4(o.matrixWorld); out.add(c); }
  // the live-kept furniture and screens shade the bake (named "occluder": Blender leaves them out of its file)
  for (const o of kept) { const c = new THREE.Mesh(o.geometry, o.material); c.name = "occluder"; c.applyMatrix4(o.matrixWorld); out.add(c); }
  const glb = await new GLTFExporter().parseAsync(out, { binary: true, maxTextureSize: 4096 });
  // the page's own day and night settings (setNight), read back rather than copied
  const hex = (c) => "#" + c.getHexString(), was = night, HIGHwas = HIGH;
  HIGH = true;
  const time = (isNight) => {
    setNight(isNight);
    return {
      sun: { color: hex(sun.color), intensity: sun.intensity },
      sky: { sky: hex(hemi.color), ground: hex(hemi.groundColor), intensity: hemi.intensity, env: scene.environmentIntensity },
      rects: bounceLights.map((l) => ({ intensity: l.intensity })),
    };
  };
  const day = time(false), nightly = time(true);
  HIGH = HIGHwas; setNight(was);
  const lights = {
    W, D, rooms: ROOMS.map((r) => ({ id: r.id, x: r.x, z: r.z, w: r.w, d: r.d })),
    sun: { from: sun.position.toArray(), to: sun.target.position.toArray(), day: day.sun, night: nightly.sun },
    sky: { day: day.sky, night: nightly.sky },
    points: roomLights.map(({ light, base, always }) => ({ at: light.getWorldPosition(new THREE.Vector3()).toArray(), color: "#" + light.color.getHexString(), intensity: base, distance: light.distance, decay: light.decay, always: !!always })),
    // the soft panels over the lounge, lobby and war room (RectAreaLight: intensity is luminance)
    rects: bounceLights.map((l, i) => ({ at: l.position.toArray(), to: l.position.clone().add(new THREE.Vector3(0, 0, -1).applyQuaternion(l.quaternion)).toArray(), width: l.width, height: l.height, color: hex(l.color), day: day.rects[i].intensity, night: nightly.rects[i].intensity })),
  };
  const put = (name, body) => fetch(`/bake/${name}`, { method: "POST", body }).then((r) => r.status);
  return { meshes: out.children.length, glb: await put("office-export.glb", glb), lights: await put("office-lights.json", JSON.stringify(lights, null, 1)) };
}
async function useBaked() {
  if (q.get("baked") === "0") return;
  const meta = await fetch("/synty/baked/office.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (!meta) return;
  const v = `?v=${meta.version}`;
  const [gltf, day] = await Promise.all([loader.loadAsync(`/synty/baked/office.glb${v}`), lightmap("day", meta)]);
  BAKED.meta = meta;
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material, g = o.geometry;
    if (!g.attributes.normal) g.computeVertexNormals(); // the file leaves them out; the ambient occlusion pass uses them
    // each surface's own colour and texture, times the light Blender worked out for it: from the
    // lightmap for the building, from each corner's light (color: day, _night: night) for furniture
    if (g.attributes.uv1) {
      const b = new THREE.MeshBasicMaterial({ map: m.map, color: m.color, side: m.side, lightMap: day, lightMapIntensity: meta.day.scale * Math.PI });
      o.material = b; BAKED.mats.push(b);
    } else if (g.attributes.color) {
      const b = new THREE.MeshBasicMaterial({ map: m.map, color: m.color.clone().multiplyScalar(meta.day.props), side: m.side, vertexColors: true });
      b.userData.base = m.color.clone(); o.material = b;
      BAKED.props.push({ mat: b, geo: g, day: g.attributes.color, night: g.attributes._night || g.attributes.color });
    }
  });
  world.add(gltf.scene);
  // the live building is hidden (the baked copy has the same shapes), and a shadow-only floor takes
  // the shadows of whatever is live (agents, screens, the rocket)
  const kept = [];
  BAKED.statics = staticMeshes(kept);
  for (const o of BAKED.statics) o.visible = false;
  // the bake has every still thing's shadow already: only what moves (agents, the rocket) casts live ones
  for (const o of kept) o.castShadow = false;
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.ShadowMaterial({ opacity: 0.3, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  // drawn first and without depth, so status rings and rugs just above the floor stay on top of it
  catcher.material.depthWrite = false; catcher.renderOrder = -1; catcher.userData.catcher = true;
  catcher.rotation.x = -Math.PI / 2; catcher.position.set(W / 2, 0, D / 2); catcher.receiveShadow = true; world.add(catcher);
  gtao.blendIntensity = 0.6; // the bake already has its soft contact shadows
  // the look tests' grade (Blender's AgX "High Contrast"): a gentle S-curve and a little more colour,
  // after tone mapping; ?grade=0 leaves it out
  if (q.get("grade") !== "0") {
    const { ShaderPass } = await import("three/addons/postprocessing/ShaderPass.js");
    composer.addPass(new ShaderPass({
      uniforms: { tDiffuse: { value: null }, amount: { value: 0.45 }, saturation: { value: 1.15 } },
      vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: `uniform sampler2D tDiffuse; uniform float amount, saturation; varying vec2 vUv;
        void main() {
          vec4 c = texture2D(tDiffuse, vUv);
          vec3 s = mix(c.rgb, c.rgb * c.rgb * (3.0 - 2.0 * c.rgb), amount);
          float l = dot(s, vec3(0.2126, 0.7152, 0.0722));
          gl_FragColor = vec4(clamp(mix(vec3(l), s, saturation), 0.0, 1.0), c.a);
        }`,
    }));
  }
  BAKED.on = true;
}
// day and night lightmaps; phones get the half-size ones
function lightmap(which, meta) {
  if (BAKED.maps[which]) return BAKED.maps[which];
  const file = `/synty/baked/office-${which}${MOBILE && meta[which].small ? "-2k" : ""}.png?v=${meta.version}`;
  BAKED.maps[which] = texLoader.loadAsync(file).then((t) => { t.channel = 1; t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; });
  return BAKED.maps[which];
}
async function bakedTime(isNight) {
  if (!BAKED.on) return;
  const which = isNight ? "night" : "day", t = await lightmap(which, BAKED.meta);
  if ((night ? "night" : "day") !== which) return; // switched again while it loaded
  for (const m of BAKED.mats) { m.lightMap = t; m.lightMapIntensity = BAKED.meta[which].scale * Math.PI; }
  for (const p of BAKED.props) { p.geo.setAttribute("color", p[which]); p.mat.color.copy(p.mat.userData.base).multiplyScalar(BAKED.meta[which].props); }
}

// =============================================================================================
// Loop
// =============================================================================================
const clock = new THREE.Clock();
const v3 = new THREE.Vector3();
function tick(dt) {
  now += dt;
  const st = now - loopStart;
  if (DEMO) while (scriptIdx < SCRIPT.length && SCRIPT[scriptIdx][0] <= st) SCRIPT[scriptIdx++][1]();
  for (let i = later.length - 1; i >= 0; i--) if (later[i].at <= now) { const f = later[i].fn; later.splice(i, 1); f(); }
  if (DEMO && st > 95) { loopStart = now; scriptIdx = 0; resetCast(); log("HQ", "<i>(the sample day starts over)</i>"); }
  const gd = CAST.guard; if (gd && gd.mode !== "walk" && Math.random() < dt * 0.06) goTo(gd, pick([{ x: 10, z: 13 }, { x: 4, z: 6 }, { x: 20, z: 6 }, "guard", "guard"]), (a) => { if (a.mode !== "sit") say(a, DEMO ? "Sample day · 3 apps running" : LIVE.health.text, 2.5, "🛡"); });
  stepAgents(dt); updateBursts(dt);
}
function animateScene(dt) {
  updateBeams();
  for (const s of screens) { const busy = agents.some((a) => a.seatId === s.seat && a.mode === "sit" && a.status !== "idle") || (s.seat === "ollama" && CAST.ollama && CAST.ollama.status === "thinking"); const on = s.synty ? (busy ? .48 : .18) : busy ? 1.6 : .12; s.mat.emissiveIntensity += (on - s.mat.emissiveIntensity) * .1; if (busy && s.tex) s.tex.offset.y -= dt * .25; }
  for (const r of racks) r.led.material.emissiveIntensity = Math.sin(now * (3 + (r.k % 3)) + r.k * 1.7 + r.i * 2) > 0.1 ? 1.8 : 0.15;
  if (gpuGlow.mat) gpuGlow.mat.emissiveIntensity = CAST.ollama && CAST.ollama.status === "thinking" ? 2.2 + Math.sin(now * 14) : 0.2;
  for (const m of cctv) if (!m.userData.securityView) m.emissiveMap.offset.y -= dt * 0.15;
  if (arcade.mat) arcade.mat.emissiveIntensity = 1.2 + Math.sin(now * 6) * 0.4;
  if (vault.wheel) vault.wheel.rotation.z = vault.spin && now - vault.spin < 2 ? (now - vault.spin) * 6 : vault.wheel.rotation.z;
  if (tvScreen.mesh) { if (!tvScreen.tex) { const c = Object.assign(document.createElement("canvas"), { width: 256, height: 144 }); tvScreen.c = c; tvScreen.tex = new THREE.CanvasTexture(c); tvScreen.tex.colorSpace = THREE.SRGBColorSpace; tvScreen.mesh.material.emissiveMap = tvScreen.tex; tvScreen.mesh.material.needsUpdate = true; }
    if (Math.floor(now * 2) !== tvScreen.f) { tvScreen.f = Math.floor(now * 2); const g = tvScreen.c.getContext("2d"); g.fillStyle = "#0f2747"; g.fillRect(0, 0, 256, 144); g.font = "26px Silkscreen"; g.fillStyle = "#93c5fd"; g.fillText(`SHIPS TODAY ${shipsToday}`, 18, 52); g.fillStyle = "#4ade80"; g.fillText("● ● ● 3/3 UP", 18, 100); tvScreen.tex.needsUpdate = true; } }
  // flash
  const fk = now - flashAt; flashLight.intensity = fk < 0.35 ? (1 - fk / 0.35) * 25 : 0;
  for (const m of softboxes) m.emissiveIntensity = fk < 0.35 ? 4 : 0.9;
  // rocket
  if (rocket.group) {
    const k = rocket.born ? now - rocket.born : -1;
    if (k >= 0 && k < 5) { rocket.flame.visible = k > 0.4; rocket.flame.scale.y = 0.8 + Math.random() * 0.5; rocket.light.intensity = k > 0.4 ? 8 : 0; rocket.group.position.y = 0.15 + (k > 1 ? Math.pow(k - 1, 2.2) * 2.2 : Math.sin(k * 80) * 0.01); if (k > 0.5 && Math.random() < 0.5) sparkle(new THREE.Vector3(29, rocket.group.position.y - 0.6, 2.3), "#fb923c", 4); }
    else if (k >= 5) { rocket.born = 0; rocket.group.position.y = 0.15; rocket.flame.visible = false; rocket.light.intensity = 0; }
  }
  for (const a of agents) {
    const c = STATUS_COLOR[a.status]; a.ring.visible = !!c;
    if (c) { a.ring.material.color.set(c); a.ring.material.opacity = a.status === "waiting" ? 0.45 + 0.45 * Math.sin(now * 7) : 0.85; a.ring.scale.setScalar(a.status === "waiting" ? 1 + 0.12 * Math.sin(now * 7) : 1); }
  }
}
function updateCamera(dt) {
  if (moveKeys.size) {
    let x = 0, y = 0;
    for (const key of moveKeys) { const dir = directions[keyDirections[key]]; x += dir[0]; y += dir[1]; }
    const length = Math.hypot(x, y);
    if (length) panView(x / length, y / length, dt);
  }
  if (cam.follow && agents.includes(cam.follow)) {
    const p = cam.follow.group.position;
    const delta = v3.set(p.x, 0.4, p.z).sub(controls.target).multiplyScalar(Math.min(1, dt * 4));
    controls.target.add(delta); camera.position.add(delta);
  }
  if (cam.goal) {
    if (cam.goal.zoom) { const dir = camera.position.clone().sub(controls.target); const want = cam.goal.zoom; const len = dir.length(); dir.setLength(len + (want - len) * Math.min(1, dt * 3)); camera.position.copy(controls.target).add(dir); if (Math.abs(len - want) < 0.05) cam.goal = null; }
    else { controls.target.lerp(cam.goal.target, Math.min(1, dt * 3)); camera.position.lerp(cam.goal.pos, Math.min(1, dt * 3)); if (camera.position.distanceTo(cam.goal.pos) < 0.05) cam.goal = null; }
  }
  controls.update();
}
function updateLabels() {
  const r = renderer.domElement.getBoundingClientRect();
  const dist = camera.position.distanceTo(controls.target);
  for (const room of ROOMS) {
    if (!room.sign) continue;
    v3.copy(room.signPosition).project(camera);
    room.sign.style.display = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05 ? "" : "none";
    room.sign.style.transform = `translate(${(v3.x+1)*r.width/2}px, ${(1-v3.y)*r.height/2}px) translate(-50%,-100%)`;
  }
  for (const a of agents) {
    v3.copy(a.group.position).setY(a.mode === "sit" ? 1.0 : 1.3).project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
    a.el.style.display = vis ? "" : "none"; if (!vis) continue;
    a.el.style.transform = `translate(${((v3.x + 1) / 2) * r.width}px, ${((1 - v3.y) / 2) * r.height}px) translate(-50%,-100%)`;
    a.el.classList.toggle("dim", filter !== "all" && a.org !== filter);
    const name = a.el.querySelector(".name"); name.style.display = dist > 34 && a.org !== 'Agents' && a !== selected && a.status === "idle" ? "none" : "";
    const b = a.el.querySelector(".bub"); if (b.style.display !== "none" && now > a.bubbleUntil) b.style.display = "none";
    const ban = a.el.querySelector(".ban"); if (ban.style.display !== "none" && now > a.bannerUntil) ban.style.display = "none";

}
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  tick(dt); animateScene(dt); updateCamera(dt); updateLabels();
  securityViews?.update(now,camera);
  composer.render();
  requestAnimationFrame(frame);
}

// Start

(async () => {
  await document.fonts.ready;
  const cfg = await fetch("/api/office-config").then((r) => r.json()).catch(() => ({}));
  if (!cfg.syntyReady) {
    document.getElementById("loading").innerHTML = "THE 3D MODELS AREN'T INSTALLED ON THIS COPY.<br><br><span style='font-family:Inter;font-size:13px;color:#a49cb8'>They're licensed to you and live only on the host (never in git). Previews don't have them: the live Pixel Office does. <a href='/classic/' style='color:#ffe36b'>Open the classic 2D office</a></span>";
    return;
  }

  if (q.get("bake") === "export") { window.__bake = await bakeExport(); document.getElementById("loading").textContent = "EXPORTED FOR BLENDER: " + JSON.stringify(window.__bake); return; }

  setNight(night); applyQuality(); addEventListener("resize", resize);
  renderInspector();

  LIVE.hq = cfg.hqUrl || (location.protocol === "https:" ? `https://${location.hostname}` : null);
  const explicitDemo = q.has("demo");
  if (LIVE.hq && !explicitDemo) {
    try { acceptLiveFeed(await readLiveFeed()); } catch { liveUnavailable(); }
  }
  if (DEMO) {
    resetCast();
    setMode(explicitDemo || !LIVE.hq ? "DEMO · SAMPLE DAY" : "DEMO · RETRYING HQ", "#ffe36b");
    log("HQ", explicitDemo || !LIVE.hq ? "Showing a <b>sample day</b>" : "Showing a <b>sample day</b> while reconnecting to HQ");
  }
  if (LIVE.hq && !explicitDemo) {
    const poller = createLivePoller({ read: readLiveFeed, accept: acceptLiveFeed, unavailable: liveUnavailable });
    const firstPoll = setTimeout(() => poller.start(), 3000);
    addEventListener("pagehide", () => { clearTimeout(firstPoll); poller.stop(); }, { once: true });

  if (q.get("follow") && CAST[q.get("follow")]) { select(CAST[q.get("follow")]); cam.goal = { zoom: 7 }; }
  if (q.get('view') === 'lounge') loungeTool.click();

  document.getElementById("loading").remove();

})();
