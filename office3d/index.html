<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<base href="/office/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a12;--panel:#14111d;--panel2:#1c1828;--line:#2a2440;--text:#f1edf9;--mute:#a49cb8;--dim:#6e6683;--hq:#ff8a3d;--jarvis:#38e1ff;--bot:#ff6fb1;--agents:#a78bfa;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:2px solid #000;background:linear-gradient(#1a1525,#110e19);flex-wrap:wrap}
.logo{font-family:"Press Start 2P",monospace;font-size:20px;white-space:nowrap}
.logo .a{background:linear-gradient(#ffe36b,#ff8a3d 60%,#ff4f6d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 #000)}
.logo .b{color:#fff;filter:drop-shadow(2px 2px 0 #3a6bff)}
.sub{font-family:Silkscreen,monospace;font-size:11px;color:#9df27a;margin-top:4px}
.stats{display:flex;gap:6px}
.stat{font-family:Silkscreen,monospace;font-size:11px;padding:5px 9px;border-radius:6px;background:#000;color:var(--mute)}
.stat b{font-size:13px;margin-left:4px}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{font-family:Silkscreen,monospace;font-size:11px;padding:5px 10px;border:2px solid #000;border-radius:6px;background:var(--panel2);color:var(--mute);cursor:pointer;box-shadow:0 2px 0 #000;user-select:none}
.chip.on{color:#111;background:#ffe36b}
.chip .d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
main{display:grid;grid-template-columns:1fr 330px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#05050a}
#view{position:absolute;inset:0}
#view canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.classic{position:absolute;left:12px;top:44px;z-index:3;text-decoration:none}
.mock{position:absolute;left:12px;top:12px;font-family:Silkscreen,monospace;font-size:10px;color:#000;background:#ffe36b;padding:3px 8px;border-radius:4px;box-shadow:2px 2px 0 #000;z-index:3}
.tools{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:3}
.tool{font-family:Silkscreen,monospace;font-size:11px;background:rgba(10,8,16,.85);color:var(--text);border:2px solid #000;border-radius:6px;padding:5px 9px;cursor:pointer;box-shadow:0 2px 0 #000;user-select:none}
.tool:hover{background:#2a2340}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#2a1d08;border:2px solid var(--warn);color:#ffe9b0;font-family:Silkscreen,monospace;font-size:11px;padding:7px 12px;border-radius:8px;box-shadow:0 3px 0 #000;display:none;white-space:nowrap;z-index:4}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:Silkscreen,monospace;color:var(--mute);z-index:5;background:#05050a}
aside{border-left:2px solid #000;background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-height:0}
.inspector{padding:14px;border-bottom:2px solid #000;min-height:200px}
h3{margin:0;font-family:Silkscreen,monospace;font-size:12px;color:var(--mute);font-weight:400}
.who{display:flex;gap:12px;align-items:center;margin-top:10px}
.av{width:52px;height:52px;border-radius:12px;border:2px solid #000;display:grid;place-items:center;font-size:24px}
.who .n{font-weight:700;font-size:16px}.who .r{color:var(--mute);font-size:12.5px}
.tag{display:inline-block;font-family:Silkscreen,monospace;font-size:10px;padding:1px 6px;border-radius:4px;color:#000;margin-top:4px}
.kv{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;margin-top:12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--dim)}
.btn{text-decoration:none;display:inline-block;margin-top:12px;font-family:Silkscreen,monospace;font-size:11px;background:#ff8a3d;color:#1a0d00;border:2px solid #000;border-radius:6px;padding:6px 10px;box-shadow:0 2px 0 #000}
.empty{color:var(--dim);font-size:12.5px;margin-top:10px}
.feed{overflow:auto;padding:12px 14px;min-height:0}
.ev{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.ev time{font-family:Silkscreen,monospace;font-size:10px;color:var(--dim);padding-top:2px}
/* labels over the 3D scene */
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;will-change:transform}
.lbl.dim{opacity:.15}
.name{font:600 11px Inter;background:rgba(10,8,16,.82);color:#f1edf9;padding:2px 8px 2px 6px;border-radius:9px;display:flex;align-items:center;gap:5px}
.name i{width:7px;height:7px;border-radius:50%;display:inline-block}
.bub{font:11px Silkscreen;background:#fff;color:#111;border:2px solid #111;border-radius:6px;padding:3px 8px;position:relative;animation:pop .25s ease-out}
.bub:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#111;border-bottom:0}
.ban{font:9px "Press Start 2P";background:#ffe36b;color:#111;border:2px solid #000;border-radius:3px;padding:4px 6px;animation:pop .3s ease-out}
.sign{font:9px Silkscreen;color:#f5e7c4;background:#1b1424;border-top:2px solid #d4af37;padding:2px 6px;border-radius:2px;letter-spacing:.5px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:1fr 200px}aside{border-left:0;border-top:2px solid #000;grid-template-columns:1fr 1fr;grid-template-rows:1fr}.inspector{border-bottom:0;border-right:2px solid #000;min-height:0;overflow:auto}.logo{font-size:14px}.chips{margin-left:0}}
@media (max-width:520px){aside{grid-template-columns:1fr}.feed,.stats,.mock{display:none}.chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%}.toast{white-space:normal;width:90%;text-align:center;font-size:10px}}
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
<header>
  <div><div class="logo"><span class="a">AGENT</span> <span class="b">OFFICE</span></div><div class="sub">EVERY AGENT IN HQ · JARVIS · LACEDUPBOT, LIVE</div></div>
  <div class="stats"><span class="stat">WORKING<b id="sWork" style="color:var(--ok)">0</b></span><span class="stat">NEEDS YOU<b id="sWait" style="color:var(--warn)">0</b></span><span class="stat">IN OFFICE<b id="sAll">0</b></span></div>
  <div class="chips" id="filters">
    <span class="chip on" data-f="all">ALL</span>
    <span class="chip" data-f="HQ"><span class="d" style="background:var(--hq)"></span>HQ</span>
    <span class="chip" data-f="Jarvis"><span class="d" style="background:var(--jarvis)"></span>JARVIS</span>
    <span class="chip" data-f="Agents"><span class="d" style="background:var(--agents)"></span>AGENTS</span>
    <span class="chip" data-f="LacedupBot"><span class="d" style="background:var(--bot)"></span>LACEDUPBOT</span>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <div id="view"></div>
    <div class="labels" id="labels"></div>
    <div class="mock" id="mode">CONNECTING…</div><a class="tool classic" href="/classic/" title="The classic 2D Pixel Office">2D</a>
    <div class="tools"><span class="tool" id="night">☾ NIGHT</span><span class="tool" id="quality">HIGH</span><span class="tool" id="fit">⤢ OVERVIEW</span></div>
    <div class="toast" id="toast"></div>
    <div class="loading" id="loading">LOADING THE OFFICE…</div>
  </div>
  <aside>
    <div class="inspector" id="insp"></div>
    <div class="feed"><h3>ACTIVITY</h3><div id="feed"></div></div>
  </aside>
</main>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { retargetClips, UAL_TO_SYNTY } from "./retarget.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// =============================================================================================
// Settings
// =============================================================================================
const q = new URLSearchParams(location.search);
const MOBILE = matchMedia("(pointer: coarse)").matches || innerWidth < 800;
let HIGH = q.get("q") ? q.get("q") === "high" : !MOBILE;
const ORG = { HQ: "#ff8a3d", Jarvis: "#38e1ff", Agents: "#a78bfa", LacedupBot: "#ff6fb1" };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (l) => l[Math.floor(Math.random() * l.length)];

// =============================================================================================
// The floor plan: cells of 1 unit. Walls sit on the edges between different zones.
// =============================================================================================
const W = 32, D = 19;
const ROOMS = [
  { id: "server", name: "SERVER ROOM", x: 0, z: 0, w: 6, d: 6, floor: "server", wall: "#4b5a78" },
  { id: "library", name: "LIBRARY", x: 6, z: 0, w: 6, d: 6, floor: "library", wall: "#e8dcc6" },
  { id: "war", name: "WAR ROOM", x: 12, z: 0, w: 9, d: 6, floor: "carpet", wall: "#5a6390" },
  { id: "proof", name: "PROOF STUDIO", x: 21, z: 0, w: 5, d: 6, floor: "studio", wall: "#f3e8ef" },
  { id: "ship", name: "SHIP DOCK", x: 26, z: 0, w: 6, d: 6, floor: "dock", wall: "#6b7280" },
  { id: "build", name: "BUILD FLOOR", x: 0, z: 7, w: 13, d: 6, floor: "wood", wall: "#efe3cd" },
  { id: "lobby", name: "LOBBY", x: 13, z: 7, w: 6, d: 6, floor: "marble", wall: "#f5efe4" },
  { id: "break", name: "BREAK ROOM", x: 19, z: 7, w: 13, d: 6, floor: "checker", wall: "#f2e6cf" },
  { id: "bots", name: "LACEDUPBOT", x: 0, z: 14, w: 9, d: 5, floor: "tech", wall: "#3f3358" },
  { id: "lounge", name: "AGENT LOUNGE", x: 9, z: 14, w: 10, d: 5, floor: "purple", wall: "#4c3d70" },
  { id: "vault", name: "VAULT", x: 19, z: 14, w: 6, d: 5, floor: "metal", wall: "#6b7280" },
  { id: "security", name: "SECURITY", x: 25, z: 14, w: 7, d: 5, floor: "sec", wall: "#334155" },
];
const zone = Array.from({ length: D }, () => Array(W).fill("hall"));
for (const r of ROOMS) for (let z = r.z; z < r.z + r.d; z++) for (let x = r.x; x < r.x + r.w; x++) zone[z][x] = r.id;
// doors: [x, z] of a room cell whose edge to the hall (above or below) is open
const DOORS = [[2, 5], [9, 5], [16, 5], [17, 5], [23, 5], [28, 5], [3, 7], [9, 7], [15, 7], [16, 7], [24, 7],
  [6, 12], [15, 12], [16, 12], [26, 12], [4, 14], [13, 14], [14, 14], [21, 14], [28, 14]];
const doorSet = new Set(DOORS.map(([x, z]) => `${x},${z}`));
const ENTRANCE = { x: 31, z: 13 }, OUTSIDE = { x: 33, z: 13 };
const blocked = Array.from({ length: D }, () => Array(W).fill(false));
// a wall between (x,z) and its neighbour?
function wallBetween(x, z, nx, nz) {
  if (nx < 0 || nz < 0 || nx >= W || nz >= D) return !(x === ENTRANCE.x && z === ENTRANCE.z && nx === W);
  const a = zone[z][x], b = zone[nz][nx];
  if (a === b) return false;
  if (a === "hall" || b === "hall") { const r = a === "hall" ? [nx, nz] : [x, z]; return !doorSet.has(`${r[0]},${r[1]}`); }
  return true;
}

// =============================================================================================
// Renderer, scene, camera, post-processing
// =============================================================================================
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, HIGH ? 2 : 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.15;
controls.minDistance = 6; controls.maxDistance = 60;
controls.screenSpacePanning = false;
const HOME = { target: new THREE.Vector3(W / 2, 0, D / 2 + 0.5), pos: new THREE.Vector3(W / 2, 22, D / 2 + 21) };
function overview() { cam.follow = null; cam.goal = { target: HOME.target.clone(), pos: MOBILE ? new THREE.Vector3(16, 16, 26) : HOME.pos.clone() }; }
const cam = { follow: null, goal: null };
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.2, scale: 1.2 });
gtao.blendIntensity = 0.85;
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.5, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function applyQuality() {
  gtao.enabled = HIGH;
  renderer.setPixelRatio(Math.min(devicePixelRatio, HIGH ? 2 : 1.25));
  sun.shadow.mapSize.set(HIGH ? 4096 : 1024, HIGH ? 4096 : 1024); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  document.getElementById("quality").textContent = HIGH ? "HIGH" : "LOW";
  resize();
}
function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height); composer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}

// lights
const hemi = new THREE.HemisphereLight("#dbeafe", "#5b4636", 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight("#fff4e0", 2.4);
sun.position.set(W / 2 - 14, 30, -10); sun.target.position.set(W / 2, 0, D / 2); scene.add(sun.target);
sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 22, bottom: -22, near: 1, far: 90 });
scene.add(sun);
const roomLights = [];
let night = q.get("night") ? q.get("night") === "1" : (() => { const h = new Date().getHours(); return h >= 19 || h < 6; })();

// =============================================================================================
// Procedural textures for floors (canvas, so no image files are needed)
// =============================================================================================
function canvasTex(size, draw, repeat = 1) {
  const c = Object.assign(document.createElement("canvas"), { width: size, height: size });
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.repeat.set(repeat, repeat);
  return t;
}
const FLOORTEX = {
  wood: canvasTex(256, (g, s) => { for (let i = 0; i < 8; i++) { g.fillStyle = ["#c58a55", "#bf8350", "#cb915b", "#c2864f"][i % 4]; g.fillRect(0, i * 32, s, 32); g.fillStyle = "#a36d3c"; g.fillRect(0, i * 32 + 30, s, 2); g.fillRect(((i * 97) % 200) + 20, i * 32, 2, 30); for (let k = 0; k < 6; k++) { g.fillStyle = "rgba(90,50,20,.08)"; g.fillRect(rnd(0, s), i * 32 + rnd(4, 26), rnd(20, 60), 1); } } }),
  library: canvasTex(256, (g, s) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#7a4b30" : "#734629"; g.fillRect(0, i * 32, s, 32); g.fillStyle = "#5c361f"; g.fillRect(0, i * 32 + 30, s, 2); g.fillRect((i * 71) % 240, i * 32, 2, 30); } }),
  carpet: canvasTex(128, (g, s) => { g.fillStyle = "#2f3a6b"; g.fillRect(0, 0, s, s); g.fillStyle = "#37447d"; for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if ((x + y) % 2) g.fillRect(x * 32 + 10, y * 32 + 10, 12, 12); for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(255,255,255,${rnd(0, 0.04)})`; g.fillRect(rnd(0, s), rnd(0, s), 1, 1); } }),
  studio: canvasTex(64, (g, s) => { g.fillStyle = "#eeebf3"; g.fillRect(0, 0, s, s); g.fillStyle = "#d9d4e3"; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s); }),
  dock: canvasTex(128, (g, s) => { g.fillStyle = "#454b5a"; g.fillRect(0, 0, s, s); g.strokeStyle = "#565d6f"; g.lineWidth = 3; g.strokeRect(0, 0, s, s); for (let i = 0; i < 6; i++) { g.fillStyle = "#6f7890"; g.fillRect(rnd(8, 120), rnd(8, 120), 3, 3); } }),
  server: canvasTex(64, (g, s) => { g.fillStyle = "#222a3c"; g.fillRect(0, 0, s, s); g.fillStyle = "#33405c"; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s); g.fillStyle = "#3d4a68"; for (const [a, b] of [[8, 8], [54, 8], [8, 54], [54, 54]]) g.fillRect(a, b, 3, 3); }),
  marble: canvasTex(128, (g, s) => { g.fillStyle = "#efe9de"; g.fillRect(0, 0, s, s); g.strokeStyle = "rgba(150,140,120,.25)"; for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(rnd(0, s), 0); g.bezierCurveTo(rnd(0, s), rnd(0, s), rnd(0, s), rnd(0, s), rnd(0, s), s); g.stroke(); } g.fillStyle = "rgba(0,0,0,.06)"; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s); }),
  checker: canvasTex(128, (g, s) => { for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? "#ecdcb8" : "#d8c095"; g.fillRect(x * 64, y * 64, 64, 64); } }),
  tech: canvasTex(128, (g, s) => { g.fillStyle = "#24283f"; g.fillRect(0, 0, s, s); g.fillStyle = "#2e3352"; g.fillRect(0, 0, s, 3); g.fillRect(0, 0, 3, s); g.fillStyle = "#ff6fb1"; g.globalAlpha = 0.35; g.fillRect(62, 0, 2, s); g.globalAlpha = 1; }),
  purple: canvasTex(128, (g, s) => { g.fillStyle = "#3b2d5a"; g.fillRect(0, 0, s, s); g.fillStyle = "#44346a"; for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) if ((x + y) % 2) g.fillRect(x * 64 + 6, y * 64 + 6, 52, 52); }),
  metal: canvasTex(64, (g, s) => { g.fillStyle = "#606a7d"; g.fillRect(0, 0, s, s); g.fillStyle = "#727d92"; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s); g.fillStyle = "#98a2b6"; for (const [a, b] of [[6, 6], [56, 6], [6, 56], [56, 56]]) g.fillRect(a, b, 3, 3); }),
  sec: canvasTex(64, (g, s) => { g.fillStyle = "#2e3946"; g.fillRect(0, 0, s, s); g.fillStyle = "#3a4757"; g.fillRect(0, 0, s, 2); }),
  hall: canvasTex(128, (g, s) => { g.fillStyle = "#b3a58e"; g.fillRect(0, 0, s, s); g.fillStyle = "#8e4752"; g.fillRect(0, 26, s, 76); g.fillStyle = "#a35562"; g.fillRect(0, 30, s, 68); g.fillStyle = "#d1a35b"; g.fillRect(0, 26, s, 3); g.fillRect(0, 99, s, 3); }),
};

// =============================================================================================
// Building: floors, walls (cutaway: back walls tall with windows, the rest low), doors
// =============================================================================================
const world = new THREE.Group(); scene.add(world);
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.02, ...o });
function buildShell() {
  // ground outside
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), std("#2d3b2a", { roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(W / 2, -0.06, D / 2); ground.receiveShadow = true; world.add(ground);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 0.6, 0.3, D + 0.6), std("#3a3346"));
  slab.position.set(W / 2, -0.2, D / 2); slab.receiveShadow = true; world.add(slab);
  // floors: one plane per zone rectangle so textures line up
  const rects = [...ROOMS.map((r) => ({ ...r })), { floor: "hall", x: 0, z: 6, w: W, d: 1 }, { floor: "hall", x: 0, z: 13, w: W, d: 1 }];
  for (const r of rects) {

  for (const p of feed.proofs) { const k = `${p.taskId}:${p.status}:${p.at}`; if (LIVE.seen.proofs.has(k)) continue; LIVE.seen.proofs.add(k); if (!first && p.status === "done") { flashAt = now; after(0.7, () => (flashAt = now)); } }
  for (const h of feed.jarvis.handoffs) {
    if (LIVE.seen.handoffs.has(h.id)) continue; LIVE.seen.handoffs.add(h.id); if (first) continue;
    const bot = [...LIVE.agents.entries()].find(([k, a]) => k.startsWith("bot:") && a.name.toLowerCase() === h.bot.toLowerCase())?.[1];
    const j = LIVE.agents.get("jarvis"); if (bot && j) { beam(j, bot, ORG.Jarvis, 3); say(j, `${h.bot}, ${short(h.text, 26)}`, 4, "💬"); }
  }
  for (const a of agents) { const k = `${a.id}:${a.status === "waiting"}`; if (a.status === "waiting" && !LIVE.seen.waits.has(k) && !first) toast(`🔔 ${a.name} needs you: ${short(a.doing, 50)}`); if (a.status === "waiting") LIVE.seen.waits.add(k); else LIVE.seen.waits.delete(`${a.id}:true`); }
  // the activity feed, newest at the top
  const fresh = feed.activity.filter((x) => !LIVE.seen.acts.has(x.id)).reverse();
  for (const x of fresh) { LIVE.seen.acts.add(x.id); log(x.type.startsWith("agent") ? "Agents" : "HQ", `${x.appName ? `<b>${x.appName}</b> · ` : ""}${x.summary}`, x.at); }
  LIVE.first = false; refreshStats();
}

async function livePoll() {
  try {
    const r = await fetch(`${LIVE.hq}/api/office`, { credentials: "omit", cache: "no-store" });
    if (!r.ok) throw new Error(`HQ said ${r.status}`);
    liveApply(await r.json());
    LIVE.fails = 0; setMode("LIVE · HQ", "#4ade80");
  } catch (e) {
    if (++LIVE.fails === 3) setMode("RECONNECTING…", "#fbbf24");
  }
  setTimeout(livePoll, 3000);
}
function setMode(text, color) { const m = document.getElementById("mode"); m.textContent = text; m.style.background = color; }
// idle agents now and then fetch a coffee, so the office never looks frozen
setInterval(() => {
  if (DEMO) return;
  const idle = agents.filter((a) => a.status === "idle" && a.mode === "sit" && a.homeSeat && !a.id.startsWith("task:"));
  const a = idle[Math.floor(Math.random() * idle.length)]; if (!a || seatTaken("coffee", a)) return;
  const home = a.homeSeat; a.wantSeat = "coffee";
  goTo(a, "coffee", (x) => { x.wantSeat = null; say(x, "Coffee break", 3, "☕"); after(6, () => { if (x.status === "idle" && agents.includes(x)) { x.wantSeat = home; goTo(x, home, (y) => (y.wantSeat = null)); } }); });
}, 40000);

// =============================================================================================
// Loop
// =============================================================================================
const clock = new THREE.Clock();
const v3 = new THREE.Vector3();
function tick(dt) {
  now += dt;
  const st = now - loopStart;
  if (DEMO) while (scriptIdx < SCRIPT.length && SCRIPT[scriptIdx][0] <= st) SCRIPT[scriptIdx++][1]();
  for (let i = later.length - 1; i >= 0; i--) if (later[i].at <= now) { const f = later[i].fn; later.splice(i, 1); f(); }
  if (DEMO && st > 95) { loopStart = now; scriptIdx = 0; resetCast(); log("HQ", "<i>(the sample day starts over)</i>"); }
  const gd = CAST.guard; if (gd && gd.mode !== "walk" && Math.random() < dt * 0.06) goTo(gd, pick([{ x: 10, z: 13 }, { x: 4, z: 6 }, { x: 20, z: 6 }, "guard", "guard"]), (a) => { if (a.mode !== "sit") say(a, "All 3 apps healthy", 2.5, "🛡"); });
  stepAgents(dt); updateBursts(dt);
}
function animateScene(dt) {
  updateBeams();
  for (const s of screens) { const busy = agents.some((a) => a.seatId === s.seat && a.mode === "sit" && a.status !== "idle") || (s.seat === "ollama" && CAST.ollama && CAST.ollama.status === "thinking"); const on = s.synty ? (busy ? 1.4 : 0.08) : busy ? 1.6 : 0.12; s.mat.emissiveIntensity += (on - s.mat.emissiveIntensity) * 0.1; if (busy && s.tex) s.tex.offset.y -= dt * 0.25; }
  for (const r of racks) r.led.material.emissiveIntensity = Math.sin(now * (3 + (r.k % 3)) + r.k * 1.7 + r.i * 2) > 0.1 ? 1.8 : 0.15;
  if (gpuGlow.mat) gpuGlow.mat.emissiveIntensity = CAST.ollama && CAST.ollama.status === "thinking" ? 2.2 + Math.sin(now * 14) : 0.2;
  for (const m of cctv) m.emissiveMap.offset.y -= dt * 0.15;
  if (arcade.mat) arcade.mat.emissiveIntensity = 1.2 + Math.sin(now * 6) * 0.4;
  if (vault.wheel) vault.wheel.rotation.z = vault.spin && now - vault.spin < 2 ? (now - vault.spin) * 6 : vault.wheel.rotation.z;
  if (tvScreen.mesh) { if (!tvScreen.tex) { const c = Object.assign(document.createElement("canvas"), { width: 256, height: 144 }); tvScreen.c = c; tvScreen.tex = new THREE.CanvasTexture(c); tvScreen.tex.colorSpace = THREE.SRGBColorSpace; tvScreen.mesh.material.emissiveMap = tvScreen.tex; tvScreen.mesh.material.needsUpdate = true; }
    if (Math.floor(now * 2) !== tvScreen.f) { tvScreen.f = Math.floor(now * 2); const g = tvScreen.c.getContext("2d"); g.fillStyle = "#0f2747"; g.fillRect(0, 0, 256, 144); g.font = "26px Silkscreen"; g.fillStyle = "#93c5fd"; g.fillText(`SHIPS TODAY ${shipsToday}`, 18, 52); g.fillStyle = "#4ade80"; g.fillText("● ● ● 3/3 UP", 18, 100); tvScreen.tex.needsUpdate = true; } }
  // flash
  const fk = now - flashAt; flashLight.intensity = fk < 0.35 ? (1 - fk / 0.35) * 25 : 0;
  for (const m of softboxes) m.emissiveIntensity = fk < 0.35 ? 4 : 0.9;
  // rocket
  if (rocket.group) {
    const k = rocket.born ? now - rocket.born : -1;
    if (k >= 0 && k < 5) { rocket.flame.visible = k > 0.4; rocket.flame.scale.y = 0.8 + Math.random() * 0.5; rocket.light.intensity = k > 0.4 ? 8 : 0; rocket.group.position.y = 0.15 + (k > 1 ? Math.pow(k - 1, 2.2) * 2.2 : Math.sin(k * 80) * 0.01); if (k > 0.5 && Math.random() < 0.5) sparkle(new THREE.Vector3(29, rocket.group.position.y - 0.6, 2.3), "#fb923c", 4); }
    else if (k >= 5) { rocket.born = 0; rocket.group.position.y = 0.15; rocket.flame.visible = false; rocket.light.intensity = 0; }
  }
  for (const a of agents) {
    const c = STATUS_COLOR[a.status]; a.ring.visible = !!c;
    if (c) { a.ring.material.color.set(c); a.ring.material.opacity = a.status === "waiting" ? 0.45 + 0.45 * Math.sin(now * 7) : 0.85; a.ring.scale.setScalar(a.status === "waiting" ? 1 + 0.12 * Math.sin(now * 7) : 1); }
  }
}
function updateCamera(dt) {
  if (cam.follow && agents.includes(cam.follow)) {
    const p = cam.follow.group.position;
    const delta = v3.set(p.x, 0.4, p.z).sub(controls.target).multiplyScalar(Math.min(1, dt * 4));
    controls.target.add(delta); camera.position.add(delta);
  }
  if (cam.goal) {
    if (cam.goal.zoom) { const dir = camera.position.clone().sub(controls.target); const want = cam.goal.zoom; const len = dir.length(); dir.setLength(len + (want - len) * Math.min(1, dt * 3)); camera.position.copy(controls.target).add(dir); if (Math.abs(len - want) < 0.05) cam.goal = null; }
    else { controls.target.lerp(cam.goal.target, Math.min(1, dt * 3)); camera.position.lerp(cam.goal.pos, Math.min(1, dt * 3)); if (camera.position.distanceTo(cam.goal.pos) < 0.05) cam.goal = null; }
  }
  controls.update();
}
function updateLabels() {
  const r = renderer.domElement.getBoundingClientRect();
  const dist = camera.position.distanceTo(controls.target);
  for (const a of agents) {
    v3.copy(a.group.position).setY(a.mode === "sit" ? 1.0 : 1.3).project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
    a.el.style.display = vis ? "" : "none"; if (!vis) continue;
    a.el.style.transform = `translate(${((v3.x + 1) / 2) * r.width}px, ${((1 - v3.y) / 2) * r.height}px) translate(-50%,-100%)`;
    a.el.classList.toggle("dim", filter !== "all" && a.org !== filter);
    const name = a.el.querySelector(".name"); name.style.display = dist > 34 && a !== selected && a.status === "idle" ? "none" : "";
    const b = a.el.querySelector(".bub"); if (b.style.display !== "none" && now > a.bubbleUntil) b.style.display = "none";
    const ban = a.el.querySelector(".ban"); if (ban.style.display !== "none" && now > a.bannerUntil) ban.style.display = "none";
    name.style.outline = a === selected ? "2px solid #ffe36b" : "";
  }
}
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  tick(dt); animateScene(dt); updateCamera(dt); updateLabels();
  composer.render();
  requestAnimationFrame(frame);
}

// =============================================================================================
// Start
// =============================================================================================
(async () => {
  await document.fonts.ready;
  const cfg = await fetch("/api/office-config").then((r) => r.json()).catch(() => ({}));
  if (!cfg.syntyReady) {
    document.getElementById("loading").innerHTML = "THE 3D MODELS AREN'T INSTALLED ON THIS COPY.<br><br><span style='font-family:Inter;font-size:13px;color:#a49cb8'>They're licensed to you and live only on the host (never in git). Previews don't have them: the live Pixel Office does. <a href='/classic/' style='color:#ffe36b'>Open the classic 2D office</a></span>";
    return;
  }
  try { await loadAll(); } catch (e) { document.getElementById("loading").textContent = "COULDN'T LOAD THE MODELS: " + e.message; return; }
  buildShell(); furnish(); addRoomLights();
  for (const [x, z] of DOORS) blocked[z][x] = false;
  setNight(night); applyQuality(); addEventListener("resize", resize);
  renderInspector();
  // live when HQ answers (the page is on the tailnet beside it), the sample day otherwise
  LIVE.hq = cfg.hqUrl || (location.protocol === "https:" ? `https://${location.hostname}` : null);
  let feed = null;
  if (LIVE.hq && !q.get("demo")) feed = await fetch(`${LIVE.hq}/api/office`, { credentials: "omit", cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (feed) { DEMO = false; liveApply(feed); setMode("LIVE · HQ", "#4ade80"); setTimeout(livePoll, 3000); }
  else { DEMO = true; resetCast(); setMode(LIVE.hq ? "DEMO · HQ NOT REACHABLE" : "DEMO · SAMPLE DAY", "#ffe36b"); log("HQ", "Showing a <b>sample day</b>: HQ isn't reachable from here"); }
  if (MOBILE) overview();
  const ff = Number(q.get("t")) || 0; for (let s = 0; s < ff; s += 1 / 30) tick(1 / 30);
  if (q.get("look")) { const v = q.get("look").split(",").map(Number); camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); cam.goal = null; }
  if (q.get("follow") && CAST[q.get("follow")]) { select(CAST[q.get("follow")]); cam.goal = { zoom: 7 }; }
  window.__office = { agents, CAST, LIVE }; // for debugging from the browser console
  document.getElementById("loading").remove();
  clock.getDelta(); frame();
})();
</script>
